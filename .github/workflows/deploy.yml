name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Deploy when pushing to main branch
  workflow_dispatch:  # Allow manual trigger

# We need 'write' to allow the bot to push the 'dist' folder to the 'gh-pages' branch
permissions:
  contents: write

# Allow only one concurrent deployment to prevent conflicts
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_GROQ_API_TOKEN: ${{ secrets.VITE_GROQ_API_TOKEN }}
        run: npm run build

      # This replaces the 'Upload artifact' and 'Deploy' jobs
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          commit-message: "deploy: skipping secret scanning for bundled assets [skip-secret-scanning:true]"
